name: VAIXLNS Omega Readiness Bridge
on:
  pull_request:
    paths:
      - "scripts/omega_readiness_bridge.py"
      - "tests/test_omega_readiness_bridge.py"
      - ".github/workflows/omega-readiness-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic readiness contract tests
        run: python -m unittest discover -s tests -p "test_omega_readiness_bridge.py" -v
