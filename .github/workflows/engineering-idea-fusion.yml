name: Engineering Idea Fusion

on:
  pull_request:
    paths:
      - "registry/federation/engineering_idea_fusion.v1.json"
      - "schemas/engineering-idea-fusion.v1.schema.json"
      - "docs/engineering/ENGINEERING_IDEA_FUSION_MATRIX_V1.md"
      - "tools/validate_engineering_idea_fusion.py"
      - "tests/test_engineering_idea_fusion.py"
      - ".github/workflows/engineering-idea-fusion.yml"
  push:
    branches: ["feat/language-repair-fabric-v1-clean"]
    paths:
      - "registry/federation/engineering_idea_fusion.v1.json"
      - "schemas/engineering-idea-fusion.v1.schema.json"
      - "tools/validate_engineering_idea_fusion.py"
      - "tests/test_engineering_idea_fusion.py"
      - ".github/workflows/engineering-idea-fusion.yml"

permissions:
  contents: read

jobs:
  fusion-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON documents
        run: |
          python -m json.tool registry/federation/engineering_idea_fusion.v1.json > /dev/null
          python -m json.tool schemas/engineering-idea-fusion.v1.schema.json > /dev/null
      - name: Compile validator and tests
        run: python -m py_compile tools/validate_engineering_idea_fusion.py tests/test_engineering_idea_fusion.py
      - name: Validate source-pinned fusion registry
        run: python tools/validate_engineering_idea_fusion.py
      - name: Run mutation/identity regression tests
        run: python -m unittest discover -s tests -p test_engineering_idea_fusion.py -v
