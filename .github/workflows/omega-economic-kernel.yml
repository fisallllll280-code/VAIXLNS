name: Omega Economic Kernel
on:
  pull_request:
    paths:
      - "scripts/omega_economic_kernel.py"
      - "tests/test_omega_economic_kernel.py"
      - "docs/economics/OMEGA_ECONOMIC_KERNEL_V1.md"
      - ".github/workflows/omega-economic-kernel.yml"
  push:
    branches: ["feat/omega-economic-kernel-v1"]
    paths:
      - "scripts/omega_economic_kernel.py"
      - "tests/test_omega_economic_kernel.py"
      - "docs/economics/OMEGA_ECONOMIC_KERNEL_V1.md"
      - ".github/workflows/omega-economic-kernel.yml"
permissions:
  contents: read
jobs:
  economic-kernel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run economic kernel tests
        run: python -m unittest discover -s tests -p 'test_omega_economic_kernel.py' -v
