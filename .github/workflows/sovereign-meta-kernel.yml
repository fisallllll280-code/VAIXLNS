name: Sovereign Meta-Kernel Conformance

on:
  pull_request:
  push:
    branches:
      - feat/sovereign-meta-kernel-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile evaluator and tests
        run: python -m py_compile scripts/sovereign_meta_kernel.py tests/test_sovereign_meta_kernel.py
      - name: Run regression suite
        run: python -m unittest -v tests.test_sovereign_meta_kernel
