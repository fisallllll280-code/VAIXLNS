name: VAIXLNS External Integration Policy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate policy
        run: python scripts/verify_external_integrations.py
