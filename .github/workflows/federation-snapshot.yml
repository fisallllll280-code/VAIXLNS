name: VAIXLNS Federation Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical registry
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Capture federation sources
        env:
          # This optional PAT must have read access to the private source repos.
          # The default GITHUB_TOKEN is scoped to this repository and will not
          # automatically grant cross-repository access to private repositories.
          VAIXLNS_FEDERATION_TOKEN: ${{ secrets.VAIXLNS_FEDERATION_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/capture_repository_snapshots.py > snapshot-run.json
          cat snapshot-run.json

      - name: Upload recovery bundle and capture manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaixlns-federation-snapshot-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            archive/vaixlns-federation-*.tar.gz
            archive/captures/*.json
            snapshot-run.json

      - name: Publish manifest through a draft pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CAPTURE_ID="$(python -c "import json; print(json.load(open('snapshot-run.json', encoding='utf-8'))['capture_id'])")"
          FAILED_COUNT="$(python -c "import json; d=json.load(open('snapshot-run.json', encoding='utf-8')); print(sum(1 for r in d.get('records', []) if r.get('status') == 'CAPTURE_FAILED'))")"
          BRANCH="automation/federation-snapshot-${CAPTURE_ID}"

          git config user.name "VAIXLNS Snapshot Bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add "archive/captures/${CAPTURE_ID}.json"
          git commit -m "archive: capture federation snapshot ${CAPTURE_ID}"
          git push --set-upstream origin "$BRANCH"

          if [ "$FAILED_COUNT" -gt 0 ]; then
            TITLE="WIP: federation snapshot ${CAPTURE_ID} (${FAILED_COUNT} capture failures)"
            OUTCOME="PARTIAL: ${FAILED_COUNT} repositories failed capture. This manifest must not be treated as a complete recovery snapshot."
          else
            TITLE="Federation snapshot: ${CAPTURE_ID}"
            OUTCOME="All eligible repositories were captured. Review manifest digests and lineage before admission."
          fi

          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "Automated federation snapshot ${CAPTURE_ID}.\n\nOutcome: ${OUTCOME}\n\nThe recovery bundle and raw run manifest are retained as this workflow's artifact. This draft PR is non-canonical and does not authorize promotion, merge, or production deployment."
