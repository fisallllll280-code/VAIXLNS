name: omega-rac
on:
  push:
    paths:
      - "omega_rac/**"
      - "tests/test_omega_rac_core.py"
      - "tools/omega/run_benchmark.py"
      - ".github/workflows/omega-rac.yml"
  pull_request:
    paths:
      - "omega_rac/**"
      - "tests/test_omega_rac_core.py"
      - "tools/omega/run_benchmark.py"
      - ".github/workflows/omega-rac.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p "test_omega_rac_core.py"
      - run: PYTHONPATH=. python tools/omega/run_benchmark.py
