name: Office Fabric Conformance

on:
  push:
    paths:
      - "registry/office_fabric.integration.v1.json"
      - "schemas/office-fabric-registry.schema.json"
      - "scripts/validate_office_fabric.py"
      - "tests/test_office_fabric.py"
      - ".github/workflows/office-fabric-conformance.yml"
  pull_request:
    paths:
      - "registry/office_fabric.integration.v1.json"
      - "schemas/office-fabric-registry.schema.json"
      - "scripts/validate_office_fabric.py"
      - "tests/test_office_fabric.py"
      - ".github/workflows/office-fabric-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  office-fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.24.0
      - name: Parse registry and schema
        run: |
          python -m json.tool registry/office_fabric.integration.v1.json > /dev/null
          python -m json.tool schemas/office-fabric-registry.schema.json > /dev/null
      - name: Compile validator and tests
        run: python -m py_compile scripts/validate_office_fabric.py tests/test_office_fabric.py
      - name: Validate registry and foreign-key graph
        run: python scripts/validate_office_fabric.py
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -p "test_office_fabric.py" -v
