name: Four-System Federation

on:
  pull_request:
    paths:
      - "registry/federation/four_system_unification.v1.json"
      - "registry/federation/federation_contract_edges.v1.json"
      - "scripts/validate_four_system_federation.py"
      - "scripts/validate_federation_contract_edges.py"
      - "tests/test_four_system_federation.py"
      - "tests/test_federation_contract_edges.py"
      - "scripts/federation_preflight.py"
      - "tests/test_federation_preflight.py"
      - "README.md"
      - ".github/workflows/four-system-federation.yml"
  push:
    branches: [main]
    paths:
      - "registry/federation/four_system_unification.v1.json"
      - "registry/federation/federation_contract_edges.v1.json"
      - "scripts/validate_four_system_federation.py"
      - "scripts/validate_federation_contract_edges.py"
      - "tests/test_four_system_federation.py"
      - "tests/test_federation_contract_edges.py"
      - ".github/workflows/four-system-federation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate four-system identity manifest
        run: python scripts/validate_four_system_federation.py
      - name: Validate typed federation contract edges
        run: python scripts/validate_federation_contract_edges.py
      - name: Run read-only federation readiness preflight
        run: python scripts/federation_preflight.py
      - name: Run preflight regression tests
        run: python -m unittest tests.test_federation_preflight -v
      - name: Run four-system regression tests
        run: python -m unittest tests.test_four_system_federation -v
      - name: Run contract-edge adversarial regression tests
        run: python -m unittest tests.test_federation_contract_edges -v
