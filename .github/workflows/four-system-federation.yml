name: Four-System Federation

on:
  pull_request:
    paths:
      - "registry/federation/four_system_unification.v1.json"
      - "scripts/validate_four_system_federation.py"
      - "tests/test_four_system_federation.py"
      - ".github/workflows/four-system-federation.yml"
  push:
    branches: [main]
    paths:
      - "registry/federation/four_system_unification.v1.json"
      - "scripts/validate_four_system_federation.py"
      - "tests/test_four_system_federation.py"
      - ".github/workflows/four-system-federation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate federation manifest
        run: python scripts/validate_four_system_federation.py
      - name: Run federation regression tests
        run: python -m unittest tests.test_four_system_federation -v
