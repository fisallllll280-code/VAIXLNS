name: VAIXLNS Innovation Registry

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build deterministic innovation index
        run: python tools/build_innovation_index.py
      - name: Validate innovation registry
        run: python tools/validate_innovation_registry.py
      - name: Commit generated index
        if: github.event_name == 'push'
        run: |
          git config user.name "VAIXLNS Innovation Registry Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/innovation/innovation-federation.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(innovation): refresh deterministic registry"
          git push
