name: GOV SAND review checks
on:
  pull_request:
    paths: ['tools/gov_sand_review.py','tests/test_gov_sand_review.py','web/gov-sand-official-brief/**','.github/workflows/gov-sand-review.yml']
  push:
    paths: ['tools/gov_sand_review.py','tests/test_gov_sand_review.py','web/gov-sand-official-brief/**','.github/workflows/gov-sand-review.yml']
permissions: {contents: read}
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m unittest discover -s tests -p 'test_gov_sand_review.py' -v
      - run: python tools/gov_sand_review.py
