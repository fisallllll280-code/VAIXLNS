name: Windows Boot Recovery Fabric

on:
  pull_request:
    paths:
      - "experiments/windows_boot_recovery/**"
      - "tests/test_windows_boot_recovery_fabric.py"
      - ".github/workflows/windows-boot-recovery-fabric.yml"
  push:
    branches: [main]
    paths:
      - "experiments/windows_boot_recovery/**"
      - "tests/test_windows_boot_recovery_fabric.py"
      - ".github/workflows/windows-boot-recovery-fabric.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run plan-only diagnostic contract tests
        run: python -m unittest discover -s tests -p 'test_windows_boot_recovery_fabric.py' -v
