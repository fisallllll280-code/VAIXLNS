name: GOV SAND prototype gate
on:
  pull_request:
    paths:
      - 'tools/gov_sand_case_triage.py'
      - 'tests/test_gov_sand_case_triage.py'
      - '.github/workflows/gov-sand-prototype-check.yml'
  push:
    paths:
      - 'tools/gov_sand_case_triage.py'
      - 'tests/test_gov_sand_case_triage.py'
      - '.github/workflows/gov-sand-prototype-check.yml'
permissions:
  contents: read
jobs:
  synthetic-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_gov_sand_case_triage.py' -v
