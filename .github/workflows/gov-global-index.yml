name: GOV global index validity
on:
  pull_request:
    paths:
      - 'registry/gov-sand/**'
      - 'tools/validate_gov_global_index.py'
      - 'tests/test_gov_global_index.py'
  push:
    paths:
      - 'registry/gov-sand/**'
      - 'tools/validate_gov_global_index.py'
      - 'tests/test_gov_global_index.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m unittest discover -s tests -p 'test_gov_global_index.py' -v
