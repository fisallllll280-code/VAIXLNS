name: VAIXLNS Automatic Index Path Depth

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate reference-derived index depth
        run: python tools/build_index_path_depth.py
      - name: Validate deterministic report
        run: python tools/build_index_path_depth.py --check
      - name: Run path-depth regression tests
        run: python -m unittest discover -s tests -p "test_index_path_depth.py" -v
      - name: Commit updated report on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "VAIXLNS Index Registry Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/index_path_depth.v1.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(index): refresh automatic path-depth map"
          git push
