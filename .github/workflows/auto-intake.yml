name: VAIXLNS Auto Intake - Governed Review

on:
  push:
    branches: [main]
    paths:
      - 'intake/inbox/**'
  pull_request:
    paths:
      - 'intake/inbox/**'
      - 'tools/auto_intake.py'
      - 'tools/stage_intake_review.py'
      - 'tests/test_auto_intake.py'
      - 'tests/test_stage_intake_review.py'
      - '.github/workflows/auto-intake.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

jobs:
  route-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify router and review stager
        run: python -m unittest discover -s tests -p 'test_*intake*.py' -v
      - name: Produce routing and library evidence
        run: python tools/auto_intake.py --root . --inbox intake/inbox --out build/auto-intake
      - name: Project Zero-Loss Index projection
        if: hashFiles('scripts/build_zero_loss_index.py') != ''
        run: python scripts/build_zero_loss_index.py --root . --output-dir build/zero-loss-index
      - name: Save metadata only (no raw uploaded payloads)
        uses: actions/upload-artifact@v4
        with:
          name: vaixlns-intake-report
          path: |
            build/auto-intake/routing-manifest.v1.json
            build/auto-intake/library-index.v1.jsonl
            build/zero-loss-index/**
          retention-days: 30

  create-library-review:
    needs: route-and-index
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted main, never a PR head
        uses: actions/checkout@v4
      - name: Stage safe text and library metadata
        run: python tools/stage_intake_review.py --root . --inbox intake/inbox
      - name: Create isolated draft review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- library docs registry archive
          if git diff --cached --quiet; then
            echo "Nothing new to route"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          review_branch="auto-intake/review-$GITHUB_RUN_ID"
          git switch -c "$review_branch"
          git commit -m 'intake: stage library objects and routing proposals for review'
          git push origin "$review_branch"
          gh pr create --base main --head "$review_branch" --draft \
            --title "intake: review received project files (run $GITHUB_RUN_ID)" \
            --body "Generated from trusted main by VAIXLNS Auto Intake. Inspect library/intake and proposed paths. No canonical admission or cross-repository merge. Binary material remains held. Human approval required."
