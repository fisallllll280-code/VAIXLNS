name: Master Workflow Orchestrator Conformance

on:
  push:
    paths:
      - "scripts/master_workflow_orchestrator.py"
      - "tests/test_master_workflow_orchestrator.py"
      - "docs/architecture/MASTER_WORKFLOW_ORCHESTRATOR_V1.md"
      - ".github/workflows/master-workflow-orchestrator.yml"
      - "registry/omega/omega-000-master-index.json"
      - "registry/agent_registry.v1.json"
      - "registry/repository-orchestration/REPOSITORY_FACTORY_MANIFEST_V1.json"
  pull_request:
    paths:
      - "scripts/master_workflow_orchestrator.py"
      - "tests/test_master_workflow_orchestrator.py"
      - "docs/architecture/MASTER_WORKFLOW_ORCHESTRATOR_V1.md"
      - ".github/workflows/master-workflow-orchestrator.yml"
      - "registry/omega/omega-000-master-index.json"
      - "registry/agent_registry.v1.json"
      - "registry/repository-orchestration/REPOSITORY_FACTORY_MANIFEST_V1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master-workflow-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source registries
        run: |
          python -m json.tool registry/omega/omega-000-master-index.json > /dev/null
          python -m json.tool registry/agent_registry.v1.json > /dev/null
          python -m json.tool registry/repository-orchestration/REPOSITORY_FACTORY_MANIFEST_V1.json > /dev/null
      - name: Compile planner and tests
        run: python -m py_compile scripts/master_workflow_orchestrator.py tests/test_master_workflow_orchestrator.py
      - name: Run deterministic planner tests
        run: python -m unittest discover -s tests -p "test_master_workflow_orchestrator.py" -v
      - name: Generate reviewable plan from canonical registries
        run: |
          python scripts/master_workflow_orchestrator.py \
            --index registry/omega/omega-000-master-index.json \
            --agents registry/agent_registry.v1.json \
            --factory registry/repository-orchestration/REPOSITORY_FACTORY_MANIFEST_V1.json \
            --request "CI conformance plan" \
            --output master-workflow-plan.json
      - name: Upload generated plan
        uses: actions/upload-artifact@v4
        with:
          name: vaixlns-master-workflow-plan
          path: master-workflow-plan.json
