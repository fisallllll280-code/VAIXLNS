name: Pattern Conformance
on:
  push:
    branches: ["feat/vaixl-pattern-real-v1"]
  pull_request:
    branches: ["main"]
jobs:
  test-pattern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p "test_*.py" -v
