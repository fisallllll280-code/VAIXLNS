name: VAIXLNS Federation Integrity

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate canonical JSON schemas
        run: |
          python -m json.tool schemas/atomic-system-record.schema.json > /dev/null
          python -m json.tool schemas/innovation-federation.schema.json > /dev/null
          python -m json.tool registry/repository-orchestration/REPOSITORY_FACTORY_MANIFEST_V1.json > /dev/null
          python -m json.tool registry/omega/VAIXLNS_GLOBAL_FABRIC.json > /dev/null

      - name: Validate Ω∞ global federation manifest
        run: |
          python -m py_compile tools/omega/validate_federation.py
          python tools/omega/validate_federation.py

      - name: Run deterministic VAIXLNS proof gate
        run: |
          python -m py_compile scripts/federation_integrity_gate.py
          python scripts/federation_integrity_gate.py

      - name: Block silent deletion from protected surfaces
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.sha }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          deleted=$(git diff --name-status "$base" "$head" | awk '$1 == "D" {print $2}')
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              archive/*|docs/recovery/*|docs/indexes/*|registry/*|schemas/*)
                echo "BLOCKED: protected path deleted: $path"
                exit 1
                ;;
            esac
          done <<< "$deleted"

      - name: Upload deterministic integrity evidence
        uses: actions/upload-artifact@v4
        with:
          name: vaixlns-federation-integrity-evidence
          path: federation-integrity-evidence.txt
          if-no-files-found: error
