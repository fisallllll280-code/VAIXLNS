name: Microsoft Agent Coordination Prototype

on:
  pull_request:
    paths:
      - "experiments/microsoft_agent_framework/**"
      - "tests/test_microsoft_agent_framework_prototype.py"
      - ".github/workflows/microsoft-agent-coordination-prototype.yml"
  push:
    branches: [main]
    paths:
      - "experiments/microsoft_agent_framework/**"
      - "tests/test_microsoft_agent_framework_prototype.py"
      - ".github/workflows/microsoft-agent-coordination-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated standard-library contract tests
        run: python -m unittest discover -s tests -p 'test_microsoft_agent_framework_prototype.py' -v
