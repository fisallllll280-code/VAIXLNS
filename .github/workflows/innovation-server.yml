name: Innovation Server

on:
  pull_request:
    paths:
      - "services/innovation_server/**"
      - "tests/test_innovation_server.py"
      - ".github/workflows/innovation-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  innovation-server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run server regression tests
        run: python -m unittest tests.test_innovation_server -v
