name: VAIXLNS Conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JSON control surfaces
        run: |
          set -euo pipefail
          python -m json.tool project.genome >/dev/null
          python -m json.tool registry/omega/omega-000-master-index.json >/dev/null
          python -m json.tool schemas/atomic-system-record.schema.json >/dev/null
          python -m json.tool schemas/innovation-federation.schema.json >/dev/null
          python -m json.tool schemas/evidence-record.schema.json >/dev/null
          python -m json.tool schemas/provenance-record.schema.json >/dev/null
          python -m json.tool schemas/proof-record.schema.json >/dev/null
          python -m json.tool registry/evidence/control-plane-proof.json >/dev/null
          python -m json.tool registry/omega/federation-source-lock.v1.json >/dev/null
          python -m json.tool registry/repository-orchestration/REPOSITORY_FACTORY_MANIFEST_V1.json >/dev/null
          python -m json.tool schemas/omega-research-result.schema.json >/dev/null
          python -m json.tool registry/omega/research-source-registry.v1.json >/dev/null
          python -m json.tool config/omega-servers.example.json >/dev/null
          python -m json.tool config/omega-server-fabric.example.json >/dev/null
          python -m json.tool config/omega-server-workload.example.json >/dev/null
          python -m json.tool config/omega-revenue-experiments.example.json >/dev/null

      - name: Compile control tooling
        run: |
          python -m py_compile \
            scripts/admission_gate.py \
            scripts/federation_integrity_gate.py \
            scripts/proof_verifier.py \
            scripts/reconstruct_control_plane.py \
            scripts/emit_provenance.py \
            scripts/repository_pulse.py \
            scripts/treasury_admission_probe.py \
            scripts/vcre_probe.py \
            tools/omega/validate_federation.py \
            tests/test_canonical_control_plane.py \
            tests/test_arc_x_reconstruct.py \
            scripts/innovation_network.py \
            tests/test_innovation_network.py \
            scripts/engineering_agent_fabric.py \
            tests/test_engineering_agent_fabric.py \
            scripts/omega_research_fabric.py \
            tests/test_omega_research_fabric.py \
            scripts/omega_error_locator.py \
            tests/test_omega_error_locator.py \
            scripts/omega_innovation_integration.py \
            tests/test_omega_innovation_integration.py \
            scripts/omega_server_fabric.py \
            tests/test_omega_server_fabric.py \
            scripts/omega_revenue_portfolio.py \
            tests/test_omega_revenue_portfolio.py \
            scripts/omega_engineering_orchestrator.py \
            tests/test_omega_engineering_orchestrator.py \
            scripts/omega_repository_lifecycle_audit.py \
            tests/test_omega_repository_lifecycle_audit.py \
            scripts/omega_system_memory.py

      - name: Run admission gate
        run: python scripts/admission_gate.py

      - name: Run federation integrity gate
        run: python scripts/federation_integrity_gate.py

      - name: Verify canonical proof
        run: python scripts/proof_verifier.py registry/evidence/control-plane-proof.json

      - name: Reconstruct control plane
        run: python scripts/reconstruct_control_plane.py > reconstruction-evidence.json

      - name: Emit provenance
        run: python scripts/emit_provenance.py

      - name: Run test suite
        id: test_suite
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee test-suite.log
          test_status=${PIPESTATUS[0]}
          exit "$test_status"

      - name: Diagnose test failure
        if: failure() && steps.test_suite.outcome == 'failure'
        continue-on-error: true
        run: python scripts/omega_error_locator.py --root . --input test-suite.log --output omega-error-triage.json

      - name: Build federated innovation network manifest
        run: python scripts/innovation_network.py --input docs/innovation/innovation-federation.json --output innovation-network.json

      - name: Analyze cross-system innovation relationships and evidence gaps
        run: python scripts/omega_innovation_integration.py --input docs/innovation/innovation-federation.json --root . --output omega-innovation-integration-graph.json

      - name: Build Ω research index (offline)
        run: python scripts/omega_research_fabric.py --root . --query "proof provenance" --output omega-research-results.json

      - name: Build engineering agent plan
        run: python scripts/engineering_agent_fabric.py --root . --output engineering-execution-plan.json

      - name: Build capability-aware server placement from innovation and integration indexes
        run: python scripts/omega_server_fabric.py --manifest config/omega-server-fabric.example.json --innovation-network innovation-network.json --innovation-integration omega-innovation-integration-graph.json --output omega-server-placement-plan.json

      - name: Build example workload placement plan
        run: python scripts/omega_server_fabric.py --manifest config/omega-server-fabric.example.json --tasks config/omega-server-workload.example.json --output omega-server-placement-demo.json

      - name: Build evidence-gated revenue portfolio
        run: python scripts/omega_revenue_portfolio.py --input config/omega-revenue-experiments.example.json --output omega-revenue-portfolio.json

      - name: Link indexes, servers, diagnostics and commercial evidence
        run: python scripts/omega_engineering_orchestrator.py --root . --output engineering-orchestration.json

      - name: Emit conformance evidence
        if: always()
        shell: bash
        run: |
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
          } > conformance-evidence.txt

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaixlns-conformance-evidence
          path: |
            conformance-evidence.txt
            reconstruction-evidence.json
            provenance.json
            innovation-network.json
            engineering-execution-plan.json
            omega-research-results.json
            omega-innovation-integration-graph.json
            test-suite.log
            omega-error-triage.json
            omega-server-placement-plan.json
            omega-server-placement-demo.json
            omega-revenue-portfolio.json
            engineering-orchestration.json
          if-no-files-found: warn
