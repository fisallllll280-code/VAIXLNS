name: VAIXLNS Conformance

on:
  push:
  pull_request:
  workflow_dispatch:
  # Periodic health check; scheduled workflows run from the default branch after merge.
  schedule:
    - cron: '43 */6 * * *'

concurrency:
  group: vaixlns-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (single revision; no history-dependent steps)
        uses: actions/checkout@v4
        with:
          # Conformance scripts read repository files and GITHUB_SHA; none inspect Git history.
          fetch-depth: 1

      - name: Validate JSON control surfaces
        run: |
          set -euo pipefail
          python -m json.tool project.genome >/dev/null
          python -m json.tool registry/omega/omega-000-master-index.json >/dev/null
          python -m json.tool schemas/atomic-system-record.schema.json >/dev/null
          python -m json.tool schemas/innovation-federation.schema.json >/dev/null
          python -m json.tool schemas/evidence-record.schema.json >/dev/null
          python -m json.tool schemas/provenance-record.schema.json >/dev/null
          python -m json.tool schemas/proof-record.schema.json >/dev/null
          python -m json.tool registry/evidence/control-plane-proof.json >/dev/null
          python -m json.tool registry/omega/federation-source-lock.v1.json >/dev/null
          python -m json.tool registry/repository-orchestration/REPOSITORY_FACTORY_MANIFEST_V1.json >/dev/null

      - name: Compile control tooling
        run: |
          python -m py_compile \
            scripts/admission_gate.py \
            scripts/agent_execution_preflight.py \
            scripts/federation_integrity_gate.py \
            scripts/proof_verifier.py \
            scripts/reconstruct_control_plane.py \
            scripts/emit_provenance.py \
            scripts/repository_pulse.py \
            scripts/treasury_admission_probe.py \
            scripts/vcre_probe.py \
            tools/omega/validate_federation.py \
            tools/build_innovation_operation_index.py \
            tools/validate_innovation_operation_index.py \
            tests/test_canonical_control_plane.py \
            tests/test_innovation_operation_index.py \
            tests/test_agent_execution_preflight.py

      - name: Run admission gate
        run: python scripts/admission_gate.py

      - name: Run federation integrity gate
        run: python scripts/federation_integrity_gate.py

      - name: Verify canonical proof
        run: python scripts/proof_verifier.py registry/evidence/control-plane-proof.json

      - name: Reconstruct control plane
        run: python scripts/reconstruct_control_plane.py > reconstruction-evidence.json

      - name: Emit provenance
        run: python scripts/emit_provenance.py

      - name: Build deterministic innovation operation index
        run: python tools/build_innovation_operation_index.py

      - name: Validate innovation operation index
        run: python tools/validate_innovation_operation_index.py

      - name: Verify deterministic index output
        run: python tools/build_innovation_operation_index.py --check

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Run deep-index agent execution preflight
        shell: bash
        run: |
          set +e
          python scripts/agent_execution_preflight.py --output agent-execution-preflight.json
          status=$?
          set -e
          if [ "$status" -eq 3 ] || [ "$status" -eq 4 ]; then
            exit "$status"
          fi
          if [ "$status" -eq 2 ]; then
            echo "::notice title=Agent execution preflight::HOLD is expected until bindings, provider adapters, and admission evidence are complete."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Emit conformance evidence
        if: always()
        shell: bash
        run: |
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
          } > conformance-evidence.txt

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaixlns-conformance-evidence
          path: |
            conformance-evidence.txt
            reconstruction-evidence.json
            provenance.json
            agent-execution-preflight.json
          if-no-files-found: error
