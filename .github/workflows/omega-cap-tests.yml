name: omega-cap-tests

on:
  pull_request:
    paths:
      - "src/vaixlns_omega_cap/**"
      - "tests/test_omega_cap_engine.py"
      - ".github/workflows/omega-cap-tests.yml"
  push:
    branches: ["feat/omega-cap-financial-engine-v1"]
    paths:
      - "src/vaixlns_omega_cap/**"
      - "tests/test_omega_cap_engine.py"
      - ".github/workflows/omega-cap-tests.yml"

permissions:
  contents: read

jobs:
  paper-risk-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run isolated risk-gate tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_omega_cap_engine.py
