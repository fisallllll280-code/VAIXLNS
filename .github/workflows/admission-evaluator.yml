name: VAIXLNS Admission Evaluator

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Compile evaluator
        run: python -m compileall -q scripts tests
      - name: Run admission tests
        run: python -m pytest -q tests/test_admission_evaluator.py
      - name: Evaluate golden candidate
        run: python scripts/admission_evaluator.py registry/admission/golden-candidate.json
