name: VX Non-Regression Gate

on:
  pull_request:
    paths:
      - "scripts/vx_nonregression_gate.py"
      - "tests/test_vx_nonregression_gate.py"
      - "docs/tools/VX_CAPABILITY_NONREGRESSION_GATE_V1.md"
      - ".github/workflows/vx-nonregression-gate.yml"
  push:
    branches:
      - "feat/vx-nonregression-evolution-gate"
    paths:
      - "scripts/vx_nonregression_gate.py"
      - "tests/test_vx_nonregression_gate.py"
      - "docs/tools/VX_CAPABILITY_NONREGRESSION_GATE_V1.md"
      - ".github/workflows/vx-nonregression-gate.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile gate and tests
        run: python -m compileall -q scripts/vx_nonregression_gate.py tests/test_vx_nonregression_gate.py
      - name: Run non-regression unit tests
        run: python -m unittest tests.test_vx_nonregression_gate -v
