name: VX Non-Regression Gate

on:
  pull_request:
    paths:
      - "scripts/vx_nonregression_gate.py"
      - "scripts/vx_mission_runner.py"
      - "tests/test_vx_nonregression_gate.py"
      - "tests/test_vx_mission_runner.py"
      - ".github/missions/vx-gate-self-check.v1.json"
      - "docs/tools/VX_CAPABILITY_NONREGRESSION_GATE_V1.md"
      - ".github/workflows/vx-nonregression-gate.yml"
  push:
    branches:
      - "feat/vx-nonregression-evolution-gate"
    paths:
      - "scripts/vx_nonregression_gate.py"
      - "scripts/vx_mission_runner.py"
      - "tests/test_vx_nonregression_gate.py"
      - "tests/test_vx_mission_runner.py"
      - ".github/missions/vx-gate-self-check.v1.json"
      - "docs/tools/VX_CAPABILITY_NONREGRESSION_GATE_V1.md"
      - ".github/workflows/vx-nonregression-gate.yml"

permissions:
  contents: read

jobs:
  mission-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute bounded VX verification mission and write evidence receipt
        run: python scripts/vx_mission_runner.py .github/missions/vx-gate-self-check.v1.json --output build/vx/vx-gate-self-check-receipt.json
      - name: Run direct regression tests
        run: python -m unittest tests.test_vx_nonregression_gate tests.test_vx_mission_runner -v
      - name: Upload mission receipt
        uses: actions/upload-artifact@v4
        with:
          name: vx-gate-self-check-receipt
          path: build/vx/vx-gate-self-check-receipt.json
          if-no-files-found: error
