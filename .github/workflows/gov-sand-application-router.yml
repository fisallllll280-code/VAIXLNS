name: GOV application routing validation
on:
  push:
    paths: ['registry/gov-sand/application-targets.v1.json','tools/gov_sand_application_router.py','tests/test_gov_sand_application_router.py','.github/workflows/gov-sand-application-router.yml']
  pull_request:
    paths: ['registry/gov-sand/application-targets.v1.json','tools/gov_sand_application_router.py','tests/test_gov_sand_application_router.py','.github/workflows/gov-sand-application-router.yml']
permissions: {contents: read}
jobs:
  test-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m unittest discover -s tests -p test_gov_sand_application_router.py -v
      - run: python tools/gov_sand_application_router.py
