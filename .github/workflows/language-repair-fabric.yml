name: Language Repair Fabric

on:
  pull_request:
    paths:
      - "tools/language_repair_fabric.py"
      - "tests/test_language_repair_fabric.py"
      - "schemas/language-repair-work-order.v1.schema.json"
      - "docs/engineering/VAIXLNS_LANGUAGE_REPAIR_FABRIC_V1.md"
      - ".github/workflows/language-repair-fabric.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-repair-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run diagnostic triage regression tests
        run: python -m unittest tests.test_language_repair_fabric -v
